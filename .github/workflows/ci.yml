name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # The engine has no dependencies, so nothing rots underneath it — but the compiler moves,
  # and a weekly run is what catches a new lint or a behaviour change before a contributor does.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Three platforms because two of the engine's guarantees are platform-shaped: the parser
      # asserts a full-depth parse survives one mebibyte of stack, and spans are asserted over
      # sources with every line-terminator form. Both have failed on exactly one OS before.
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `missing_docs` is denied in lib.rs, so this fails on an undocumented public item.
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The toolchain as an *input* rather than as the action's ref. Pinning it as `@1.88.0`
      # also works, but Dependabot reads that ref as an action version and offers to "upgrade"
      # it — which would silently move this job off the MSRV it exists to check.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  invariants:
    name: zero dependencies, no unsafe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Two of the three non-negotiables in GOAL.md, checked mechanically rather than trusted.
      # `#![forbid(unsafe_code)]` makes the compiler enforce the second; this asserts the
      # attribute is still there, since deleting it is the one way to get around it quietly.
      # The package is looked up by name, so it has to assert it *found* one. Summing over a
      # filter that matches nothing gives zero, and `-eq 0` then passes for a crate that could
      # have any number of dependencies — which is exactly what happened when the package was
      # renamed and this line was not: a green build asserting nothing at all.
      - name: the dependency table is empty
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          found=$(echo "$metadata" | python3 -c 'import json,sys; print(sum(1 for x in json.load(sys.stdin)["packages"] if x["name"]=="viperjs"))')
          test "$found" -eq 1 || { echo "no package named viperjs — this check would pass vacuously"; exit 1; }
          count=$(echo "$metadata" | python3 -c 'import json,sys; print(sum(len(x["dependencies"]) for x in json.load(sys.stdin)["packages"] if x["name"]=="viperjs"))')
          echo "viperjs declares $count dependencies"
          test "$count" -eq 0
      # **Every crate root, not just the library.** `#![forbid(unsafe_code)]` is an attribute on
      # one crate root and covers nothing outside it, so `src/bin/viper.rs` could contain `unsafe`
      # and compile with the library's attribute untouched. DR-0002 names both for that reason.
      - name: unsafe code is forbidden in every crate root
        run: |
          for root in src/lib.rs src/bin/viper.rs; do
            grep -q '^#!\[forbid(unsafe_code)\]' "$root" \
              || { echo "$root does not forbid unsafe code"; exit 1; }
          done
