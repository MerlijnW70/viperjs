[package]
name = "praxis"
version = "0.1.0"
edition = "2024"
description = "An embeddable JavaScript engine in safe Rust, with zero runtime dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MerlijnW70/praxis"
homepage = "https://github.com/MerlijnW70/praxis"
documentation = "https://docs.rs/praxis"
readme = "README.md"
authors = ["MerlijnW70"]
keywords = ["javascript", "ecmascript", "interpreter", "engine", "embeddable"]
categories = ["compilers"]
# Measured, not assumed: 1.87 fails on the let-chains the parser uses and 1.88 is the first
# release that takes them. Edition 2024 alone would only ask for 1.85. Stated here so that a
# bump is a deliberate change with a release note, not something a contributor finds in CI.
rust-version = "1.88"
# An allow-list rather than a deny-list, because the failure modes are not symmetrical: a file
# forgotten from an exclude list ships by accident, where one forgotten from an include list is
# merely absent. The three legal files are named explicitly for that reason — a crate that ships
# without its licence and its copyright notice is the one omission that actually matters. The
# lab and the vendored suite are simply not on the list.
include = ["/src", "/examples", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/GOAL.md",
           "/LICENSE-MIT", "/LICENSE-APACHE", "/COPYRIGHT"]

# ZERO runtime dependencies, forever (GOAL.md non-negotiable #2). This table stays empty.
# If you believe you need a crate, stop and say so — do not add one.
[dependencies]

[dev-dependencies]

# Both are WORKSPACE MEMBERS and neither is a dependency: `cargo test` at the root touches the
# engine alone. The lab (see lab/README.md) holds experiments; `conformance/` runs test262 and
# depends on the engine one way only, which is what keeps the engine's dependency table empty.
[workspace]
members = ["conformance", "lab"]

[profile.release]
# The engine is embedded in other people's binaries: size and predictability beat the last
# few percent of throughput. Revisit only with a benchmark that says otherwise.
opt-level = 3
lto = "thin"

[profile.test]
# The suite is run far more often than it is debugged, and nothing here steps through a test
# binary — so skip the debuginfo and the link cost that comes with it.
debug = 0
